name: Apply live Quality Gate patch

on:
  push:
    branches: [feature/live-quality-gate-patch]
    paths: [.github/workflows/apply-live-quality-gate.yml]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/live-quality-gate-patch
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Apply exact Quality Gate edits
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/routes/_authenticated/app.website.tsx')
          text = path.read_text()
          text = text.replace('import { VisualCheckPanel } from "@/components/app/VisualCheckPanel";\n', 'import { VisualCheckPanel } from "@/components/app/VisualCheckPanel";\nimport { GeneratedSiteQualityPanel } from "@/components/site/GeneratedSiteQualityPanel";\nimport { assessGeneratedSiteQuality } from "@/lib/generated-site-quality-evidence";\nimport { commandFromQualityRecommendation } from "@/lib/generated-site-quality-commands";\n', 1)
          marker = '  // Regression watch: compare this real check against the previous one for this\n'
          addition = '''  const hasPreflightFailure = preflightResult.checks.some((check) => check.status === "fail");
          const qualityAssessment = assessGeneratedSiteQuality({
            brandProfileResolved: Boolean(profileQuery.data && org?.name),
            heroHasSpecificOfferAndCta: Boolean((seo.headline ?? copy?.heroHeadline) && captureCount > 0),
            primaryConversionRouteWorks: captureCount > 0,
            verifiedFactsAndTrustProof: !hasPreflightFailure,
            specificNonPlaceholderContent: Boolean(copy && servicesCount > 0 && profile?.["description"]),
            consistentTokensAndComposition: visibleSections > 0,
            responsiveChecksPass: !hasPreflightFailure,
            accessibilityChecksPass: !hasPreflightFailure,
            performanceChecksPass: !hasPreflightFailure,
            assetAndFactProvenanceComplete: !hasPreflightFailure,
            blockedReasons: production?.unlocked === false ? [production.reason ?? "Publishing is currently locked."] : [],
          });
          const handleQualityFix = (recommendation: import("@/lib/generated-site-quality").QualityRecommendation) => {
            const command = commandFromQualityRecommendation(recommendation);
            goTo("ai");
            askAssistant(command.prompt);
          };

          '''
          if marker not in text: raise SystemExit('route marker missing')
          text = text.replace(marker, addition + marker, 1)
          marker = '                  <VisualCheckPanel\n                    organizationId={orgId}\n'
          if marker not in text: raise SystemExit('panel marker missing')
          text = text.replace(marker, '                  <GeneratedSiteQualityPanel assessment={qualityAssessment} onFix={manage ? handleQualityFix : undefined} />\n' + marker, 1)
          path.write_text(text)
          panel = Path('src/components/site/GeneratedSiteQualityPanel.tsx')
          text = panel.read_text()
          text = text.replace('import type { GeneratedSiteQualityAssessment } from "../../lib/generated-site-quality-evidence";\n', 'import type { QualityRecommendation } from "../../lib/generated-site-quality";\nimport type { GeneratedSiteQualityAssessment } from "../../lib/generated-site-quality-evidence";\n', 1)
          text = text.replace('onFix?: (action: string) => void;', 'onFix?: (recommendation: QualityRecommendation) => void;', 1)
          text = text.replace('recommendations.map((recommendation, index) =>', 'recommendations.map((recommendation) =>', 1)
          text = text.replace('onFix(recommendation.action)', 'onFix(recommendation)', 1)
          panel.write_text(text)
          PY
      - run: bun test
      - name: Commit applied integration
        run: |
          rm .github/workflows/apply-live-quality-gate.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/routes/_authenticated/app.website.tsx src/components/site/GeneratedSiteQualityPanel.tsx .github/workflows/apply-live-quality-gate.yml
          git commit -m 'feat: wire live quality gate into builder'
          git push origin HEAD:feature/live-quality-gate-patch
