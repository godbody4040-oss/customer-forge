name: Apply builder master improvements

on:
  push:
    branches: [fix/builder-master-improvements]
    paths:
      - .github/workflows/apply-builder-master-improvements.yml
      - .patches/builder-master-improvements.patch

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/builder-master-improvements
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Apply verified fixes
        run: |
          git apply --check .patches/builder-master-improvements.patch
          git apply .patches/builder-master-improvements.patch
      - run: bun run typecheck
      - run: bun test
      - name: Commit applied improvements
        run: |
          rm -f .github/workflows/apply-builder-master-improvements.yml .patches/builder-master-improvements.patch
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A src/lib/site-agent.functions.ts src/lib/builder/master-engine.ts src/lib/builder/visual-intelligence.ts .github/workflows/apply-builder-master-improvements.yml .patches/builder-master-improvements.patch
          git commit -m 'fix: harden builder apply and master improvements'
          git push origin HEAD:fix/builder-master-improvements
